env:
  sim_path: "/Users/jaysm/Desktop/donkey_sim.app/Contents/MacOS/donkey_sim"     # path to the Unity simulator executable
  env_id: "donkey-waveshare-v0"  
  host: "127.0.0.1"
  port: 9091
  image_size: [80, 160, 3]            
  frame_skip: 2
  max_episode_steps: 2000

vae:
  latent_dim: 64
  checkpoint: "checkpoints/vae_mixed.pt"

reward:
  mode: "fast"                        
                                        
  progress_weight: 1.0
  cross_track_weight: -1.0
  crash_penalty: -10.0
  min_speed_penalty: -0.5              
  max_cte: 1.5                         
  safe_speed_cap: 1.0                 
  lap_complete_bonus: 20.0            
  lap_steps_bonus_scale: 5000.0        
  lap_departure_m: 2.0                 
  lap_return_m: 0.1                   

sac:
  total_timesteps: 100000
  learning_rate: 0.0003
  buffer_size: 100000
  batch_size: 256
  gamma: 0.99
  tau: 0.005
  train_freq: 1
  gradient_steps: 2
  learning_starts: 1000
  policy_kwargs:
    net_arch: [64, 64]
  tensorboard_log: "runs/sac_vae_mixed"
  checkpoint_out: "checkpoints/sac_mixed.zip"
  save_every_steps: 5000

ppo:
  total_timesteps: 100000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  tensorboard_log: "runs/ppo_baseline"
  checkpoint_out: "checkpoints/ppo_donkey.zip"
  save_every_steps: 2500